<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo al Evento | Kayros Center Villavicencio</title>
  <meta name="description" content="Inscripción y acceso al evento oficial de la Iglesia Cristiana Kayros Center en Villavicencio.">
  <link rel="canonical" href="https://kayroscenter.com/evento">
  <link rel="icon" type="image/png" href="assets/images/isotipo-dark.png">

  <!-- Open Graph / Redes Sociales -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CO">
  <meta property="og:url" content="https://kayroscenter.com/evento">
  <meta property="og:site_name" content="Kayros Center Villavicencio">
  <meta property="og:title" content="Inscripción a Evento - Kayros Center">
  <meta property="og:description" content="Accede al formulario oficial del evento de Kayros Center Villavicencio.">
  <meta property="og:image" content="https://kayroscenter.com/assets/images/hero-banner-1.jpg">

  <!-- Redirección HTTP instantánea (Meta Refresh) -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzc2lkUD7qj0E54h5GjGF5FbGscAm5hTaBk7bW9YA9HX5X5eBRuFdi4eBsFwIPImuWE/exec">

  <!-- Redirección Javascript Inmediata -->
  <script>
    (function() {
      var targetUrl = "https://script.google.com/macros/s/AKfycbzc2lkUD7qj0E54h5GjGF5FbGscAm5hTaBk7bW9YA9HX5X5eBRuFdi4eBsFwIPImuWE/exec";
      try {
        window.location.replace(targetUrl);
      } catch (e) {
        window.location.href = targetUrl;
      }
    })();
  </script>

  <style>
    :root {
      --bg: #0a0c10;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f0f6fc;
      --text-muted: #8b949e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .ambient-bg {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, rgba(10, 12, 16, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .redirect-card {
      position: relative;
      z-index: 1;
      max-width: 460px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .logo-badge img {
      width: 46px;
      height: auto;
      object-fit: contain;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(37, 99, 235, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .redirect-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }
    .redirect-btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    .church-brand {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #6e7681;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="redirect-card">
    <div class="logo-badge">
      <img src="assets/images/isotipo-dark.png" alt="Kayros Center" onerror="this.style.display='none'">
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Redirigiendo al evento...</h1>
    <p>Estamos conectándote con el formulario oficial de Kayros Center.</p>
    <a id="redirectBtn" href="https://script.google.com/macros/s/AKfycbzc2lkUD7qj0E54h5GjGF5FbGscAm5hTaBk7bW9YA9HX5X5eBRuFdi4eBsFwIPImuWE/exec" class="redirect-btn">
      Ingresar al Formulario
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
    <div class="church-brand">Kayros Center Villavicencio</div>
  </div>

  <script>
    // Respaldo de redirección inmediata
    var target = "https://script.google.com/macros/s/AKfycbzc2lkUD7qj0E54h5GjGF5FbGscAm5hTaBk7bW9YA9HX5X5eBRuFdi4eBsFwIPImuWE/exec";
    setTimeout(function() {
      window.location.href = target;
    }, 100);
  </script>
</body>
</html>
